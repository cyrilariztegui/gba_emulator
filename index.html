<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>RETROCORE</title>
  <meta name="theme-color" content="#111125">

  <!-- PWA / mode standalone iOS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RETROCORE">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">

  <!-- Typographies -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- ================= Écran de lancement ================= -->
  <div id="splash">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="34" y="6" width="32" height="16" rx="4" fill="#8117ed"/>
      <rect x="18" y="12" width="64" height="76" rx="7" fill="#8117ed"/>
      <rect x="28" y="26" width="44" height="32" rx="4" fill="#111125"/>
      <rect x="45" y="37" width="10" height="10" fill="#8117ed"/>
      <rect x="30" y="66" width="40" height="4" rx="2" fill="#111125"/>
      <rect x="30" y="73" width="40" height="4" rx="2" fill="#111125"/>
      <rect x="30" y="80" width="40" height="4" rx="2" fill="#111125"/>
    </svg>
    <p>RETRO<span class="core">CORE</span></p>
  </div>

  <!-- ================= Écran de lancement ================= -->
  <div id="splash">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="18" y="12" width="64" height="14" rx="4" fill="#8117ed"/>
      <rect x="10" y="22" width="80" height="66" rx="8" fill="#8117ed"/>
      <rect x="22" y="34" width="56" height="30" rx="4" fill="#111125"/>
      <rect x="45" y="45" width="10" height="10" fill="#8117ed"/>
      <rect x="26" y="70" width="48" height="4" rx="2" fill="#111125"/>
      <rect x="26" y="78" width="48" height="4" rx="2" fill="#111125"/>
    </svg>
    <h1>RETRO<span class="core">CORE</span></h1>
  </div>

  <!-- ================= Écran bibliothèque ================= -->
  <section id="screen-library" class="screen active">
    <header id="library-header">
      <h1>RETRO<span class="core">CORE</span></h1>
    </header>

    <div id="rom-list"></div>

    <div id="empty-state">
      <h2>Aucun jeu</h2>
      <p>Importe une ROM .gba pour commencer.</p>
    </div>

    <div id="import-bar" class="glass">
      <label class="btn primary" for="rom-input">＋ Importer une ROM</label>
      <!-- Pas d'attribut `accept` : iOS grise les extensions sans UTI
           système (.gba). Le filtrage se fait dans onImport (app.js). -->
      <input id="rom-input" type="file" multiple hidden>
    </div>
  </section>

  <!-- ================= Écran de jeu ================= -->
  <section id="screen-player" class="screen">
    <div id="player-topbar">
      <button id="btn-quit" class="btn icon glass" aria-label="Quitter">←</button>
      <div class="spacer"></div>
      <button id="btn-menu" class="btn glass accent">☰ Menu</button>
      <button id="btn-fastforward" class="btn icon glass" aria-label="Avance rapide" aria-pressed="false">»</button>
      <button id="btn-states" class="btn glass">États</button>
      <button id="btn-cheats" class="btn glass">Triche</button>
    </div>
    <div id="emu-host"></div>
  </section>

  <!-- ================= Sheet : save states ================= -->
  <div id="sheet-states" class="sheet glass">
    <div class="sheet-header">
      <h2>Sauvegardes rapides</h2>
      <button class="close" aria-label="Fermer">✕</button>
    </div>
    <div id="slots-mode">
      <button id="mode-save" class="btn selected">Sauvegarder</button>
      <button id="mode-load" class="btn">Charger</button>
    </div>
    <div id="slots-grid"></div>
  </div>

  <!-- ================= Sheet : codes de triche ================= -->
  <div id="sheet-cheats" class="sheet glass">
    <div class="sheet-header">
      <h2>Codes GameShark</h2>
      <button class="close" aria-label="Fermer">✕</button>
    </div>
    <div id="cheat-form">
      <input id="cheat-desc" type="text" placeholder="Description (ex. Vies infinies)" autocomplete="off">
      <input id="cheat-code" type="text" placeholder="XXXXXXXX YYYYYYYY" autocomplete="off" spellcheck="false">
      <button id="btn-add-cheat" class="btn primary">Ajouter le code</button>
    </div>
    <div id="cheat-list"></div>
  </div>

  <div id="scrim"></div>
  <div id="toast" class="glass"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
